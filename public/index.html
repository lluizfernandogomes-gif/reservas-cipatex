 C 116.015 15.634 116.07 15.898 116.165 16.009 L 116.913 16.009 C 116.857 15.898 116.782 15.728 116.688 15.261 C 116.593 14.849 116.442 14.604 116.142 14.513 M 115.302 14.287 L 114.966 14.287 L 114.966 13.408 C 115.041 13.389 115.172 13.369 115.358 13.369 C 115.809 13.369 116.015 13.559 116.015 13.84 C 116.015 14.157 115.698 14.287 115.302 14.287 Z%22/%3E%3C/svg%3E");--bg:#f4f4f8;--card:#fff;--tx:#151520;--mut:#79798d;--ln:#e1e2ea;--pri:#036c99;--pri2:#0296d3;--navy:#151520;--navy2:#2e2e3b;--lav:#bcbcd7;--ok:#1d8a4e;--warn:#b7791f;--err:#c0392b;--r:12px}
*{box-sizing:border-box}
body{margin:0;font-family:"Red Hat Display",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);font-size:15px}
button,input,select,textarea{font:inherit}
.hide{display:none!important}
header{background:var(--navy);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
header h1{font-size:15px;margin:0;flex:1;font-weight:500;color:var(--lav);display:flex;align-items:center;gap:12px}
.brand{display:inline-block;width:92px;height:32px;background:currentColor;-webkit-mask:var(--logo) no-repeat center/contain;mask:var(--logo) no-repeat center/contain;color:#fff;flex:none}
.brand.lg{width:170px;height:58px}
.sep{width:1px;height:20px;background:var(--navy2)}
header .who{font-size:13px;opacity:.85}
nav{display:flex;gap:4px;overflow-x:auto;background:#fff;border-bottom:1px solid var(--ln);padding:0 8px;position:sticky;top:48px;z-index:4}
nav button{border:0;background:none;padding:12px 12px;color:var(--mut);border-bottom:3px solid transparent;white-space:nowrap;cursor:pointer}
nav button.on{color:var(--navy);border-color:var(--pri2);font-weight:700}
main{max-width:980px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:var(--r);padding:16px;margin-bottom:12px}
.card h2{font-size:16px;margin:0 0 12px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--ln);border-radius:8px;background:#fff;color:var(--tx)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri2);outline-offset:-1px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:0;border-radius:99px;padding:10px 16px;background:var(--pri);color:#fff;cursor:pointer;font-weight:600}
.btn:disabled{opacity:.5;cursor:default}
.btn.sec{background:#e6f3fa;color:var(--pri)}
.btn.ok{background:var(--ok)}.btn.err{background:var(--err)}
.btn.sm{padding:6px 12px;font-size:13px}
header .btn.sec{background:var(--navy2);color:#fff}
.auth{padding:0 16px}
html{min-height:100%;background:var(--bg)}
body:has(#vLogin:not(.hide)){min-height:100vh;background:linear-gradient(170deg,#151520 0,#2e2e3b 38%,#f4f4f8 38.1%) no-repeat}
.btn.full{width:100%;margin-top:14px}
.link{background:none;border:0;color:var(--pri2);cursor:pointer;padding:0;text-decoration:underline}
.msg{padding:10px 12px;border-radius:8px;margin:10px 0;font-size:14px}
.msg.err{background:#fdecea;color:var(--err)}.msg.ok{background:#e6f4ec;color:var(--ok)}.msg.info{background:#eaf2f9;color:var(--pri)}
.list{display:flex;flex-direction:column;gap:8px}
.item{border:1px solid var(--ln);border-radius:10px;padding:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#fff}
.item .grow{flex:1;min-width:180px}
.item .t{font-weight:600}.item .s{font-size:13px;color:var(--mut);margin-top:2px}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:#eef1f5;color:var(--mut);font-weight:600}
.tag.reservada{background:#eaf2f9;color:var(--pri2)}.tag.em_uso{background:#fff4e0;color:var(--warn)}
.tag.concluida{background:#e6f4ec;color:var(--ok)}.tag.cancelada,.tag.no_show{background:#f3e9e9;color:var(--err)}
.tag.gestor{background:#efe8fa;color:#6b3fa0}.tag.portaria{background:#e6f3fa;color:var(--pri)}
.ag-bar.bloq{background:repeating-linear-gradient(45deg,#79798d 0,#79798d 6px,#8d8da0 6px,#8d8da0 12px)}
.pt-item{border:1px solid var(--ln);border-radius:12px;padding:14px;background:#fff;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.pt-item .grow{flex:1;min-width:200px}.pt-item .t{font-size:17px;font-weight:700}.pt-item .s{color:var(--mut);font-size:14px;margin-top:2px}
.pt-item .btn{padding:12px 18px;font-size:15px}.pt-item.late{border-color:var(--err);background:#fff7f6}
.sec-h{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);margin:18px 0 8px}
table.rel{width:100%;border-collapse:collapse;font-size:14px}table.rel th,table.rel td{padding:8px 6px;border-bottom:1px solid var(--ln);text-align:right;white-space:nowrap}
table.rel th:first-child,table.rel td:first-child{text-align:left;white-space:normal}table.rel th{font-size:12px;color:var(--mut);font-weight:600}
.bar{height:6px;border-radius:3px;background:#e6f3fa;overflow:hidden;min-width:60px}.bar i{display:block;height:100%;background:var(--pri2)}
.tbl{overflow-x:auto}.hint{font-size:13px;color:var(--mut)}
.subnav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.subnav button{border:1px solid var(--ln);background:#fff;border-radius:99px;padding:7px 14px;cursor:pointer;color:var(--mut);font-weight:600}
.subnav button.on{background:var(--navy);border-color:var(--navy);color:#fff}.subnav .n{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;border-radius:99px;background:var(--err);color:#fff;font-size:11px;line-height:18px}
.tag.vencido{background:#fdecea;color:var(--err)}.tag.alerta{background:#fff4e0;color:var(--warn)}.tag.ok{background:#e6f4ec;color:var(--ok)}.tag.aberta{background:#eaf2f9;color:var(--pri2)}
.item.vencido{border-left:4px solid var(--err)}.item.alerta{border-left:4px solid var(--warn)}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{font-size:12px;padding:4px 10px;border-radius:99px;border:1px solid var(--ln);background:#fff;cursor:pointer}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--tx);margin:6px 0}.chk input{width:auto}
nav .n{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:99px;background:var(--err);color:#fff;font-size:11px;line-height:18px;font-weight:700}
.drop{border:2px dashed var(--ln);border-radius:12px;padding:18px;text-align:center;color:var(--mut);cursor:pointer}.drop:hover{border-color:var(--pri2)}.tag.pendente{background:#fff4e0;color:var(--warn)}
.veic{cursor:pointer}.veic.sel{border-color:var(--pri2);outline:2px solid var(--pri2)}
.veic.ocup{opacity:.45;cursor:not-allowed}
.empty{color:var(--mut);text-align:center;padding:20px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-bottom:12px}
.toolbar>*{flex:1;min-width:140px}
.toolbar .btn{flex:0 0 auto;white-space:nowrap}
/* agenda */
.ag{overflow-x:auto}
.ag-grid{min-width:720px}
.ag-row{display:grid;grid-template-columns:140px 1fr;border-bottom:1px solid var(--ln);min-height:38px}
.ag-row .nm{font-size:13px;padding:8px 6px;border-right:1px solid var(--ln)}
.ag-row .nm small{display:block;color:var(--mut)}
.ag-tl{position:relative;background:repeating-linear-gradient(90deg,transparent 0,transparent calc(100%/24 - 1px),#eef1f5 calc(100%/24 - 1px),#eef1f5 calc(100%/24))}
.ag-bar{position:absolute;top:5px;bottom:5px;border-radius:6px;background:var(--pri2);color:#fff;font-size:11px;padding:2px 5px;overflow:hidden;white-space:nowrap}
.ag-bar.em_uso{background:var(--warn)}
.ag-head{display:grid;grid-template-columns:140px 1fr;font-size:11px;color:var(--mut)}
.ag-hours{display:grid;grid-template-columns:repeat(24,1fr)}
.ag-hours span{padding:4px 0 4px 2px;border-left:1px solid var(--ln)}
/* modal */
.mod{position:fixed;inset:0;background:rgba(10,20,30,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.mod .card{width:100%;max-width:440px;max-height:90vh;overflow:auto;margin:0}.mod .card.wide{max-width:760px}
.fs{border:1px solid var(--ln);border-radius:12px;padding:4px 14px 14px;margin:12px 0 0}.fs legend{font-weight:700;font-size:14px;padding:0 6px;color:var(--navy)}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}@media(max-width:560px){.row3{grid-template-columns:1fr}}
.code{font-size:32px;letter-spacing:6px;font-weight:700;text-align:center;padding:12px;background:#eaf2f9;border-radius:10px;color:var(--pri);margin:10px 0}
.auth{max-width:412px;margin:0 auto;padding-top:48px!important}
.auth .logo{text-align:center;margin-bottom:16px}
.auth .logo b{display:block;font-size:18px;color:#fff;font-weight:600;margin-top:6px}
.auth .logo span{color:var(--mut);font-size:13px}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:12px}
.stat div{background:#fff;border:1px solid var(--ln);border-radius:10px;padding:10px}
.stat b{display:block;font-size:22px}.stat span{font-size:12px;color:var(--mut)}
@media(max-width:560px){.row{grid-template-columns:1fr}main{padding:12px}header .sep,header .ht{display:none}header .who{font-size:12px;text-align:right}}
</style>
</head>
<body>

<!-- LOGIN -->
<section id="vLogin" class="auth hide">
  <div class="logo"><i class="brand lg" role="img" aria-label="Cipatex"></i><b>Reserva de Veículos</b></div>
  <div class="card" id="boxLogin">
    <h2>Entrar</h2>
    <form id="fLogin">
      <label>E-mail</label><input id="lUser" type="text" inputmode="email" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="seu.nome@cipatex.com.br" required>
      <label>Senha</label><input id="lPass" type="password" autocomplete="current-password" required>
      <div id="lMsg"></div>
      <button class="btn full">Entrar</button>
    </form>
    <p style="text-align:center;margin:14px 0 0;font-size:14px">Primeiro acesso ou senha redefinida? <button class="link" id="goAtivar">Ativar conta</button></p>
  </div>
  <div class="card hide" id="boxAtivar">
    <h2>Ativar conta</h2>
    <p style="font-size:14px;color:var(--mut);margin:0">Use seu e-mail e o código de 6 dígitos que o gestor te passou e crie sua senha.</p>
    <form id="fAtivar">
      <label>E-mail</label><input id="aUser" type="text" inputmode="email" autocapitalize="none" spellcheck="false" placeholder="seu.nome@cipatex.com.br" required>
      <label>Código</label><input id="aCod" inputmode="numeric" maxlength="6" required>
      <label>Nova senha (mín. 6 caracteres)</label><input id="aPass" type="password" autocomplete="new-password" minlength="6" required>
      <label>Repita a senha</label><input id="aPass2" type="password" autocomplete="new-password" minlength="6" required>
      <div id="aMsg"></div>
      <button class="btn full">Criar senha e entrar</button>
    </form>
    <p style="text-align:center;margin:14px 0 0"><button class="link" id="goLogin">Voltar para o login</button></p>
  </div>
</section>

<!-- APP -->
<section id="vApp" class="hide">
  <header><h1><i class="brand" role="img" aria-label="Cipatex"></i><span class="sep"></span><span class="ht">Reserva de Veículos</span></h1><span class="who" id="who"></span><button class="btn sm sec" id="btnSair">Sair</button></header>
  <nav id="nav"></nav>
  <main id="main"></main>
</section>

<div id="modal"></div>

<script>
// ===== Config =====
const SUPABASE_URL = 'https://nqkwpgkeieunkaoffuku.supabase.co';
const SUPABASE_KEY = 'sb_publishable_9gGFFpRZF0KM2ZAGGH3NPQ_wz4hSkdT';
const EMPRESA = (new URLSearchParams(location.search).get('e') || 'cipatex').toLowerCase();
const DOMINIO = 'reservas.powertec.app';

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { db: { schema: 'reservas' } });
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const emailDe = u => { u = u.trim().toLowerCase(); return u.includes('@') ? u : `${u}.${EMPRESA}@${DOMINIO}`; };
const STATUS = {reservada:'Reservada',em_uso:'Em uso',concluida:'Concluída',cancelada:'Cancelada',no_show:'Não retirada'};

let ME = null, EMP = null, CATS = [], VEIC = [], TAB = null;

// ===== Datas =====
const pad = n => String(n).padStart(2,'0');
const toLocalInput = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
const toDateInput = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fmt = iso => { const d = new Date(iso); return `${pad(d.getDate())}/${pad(d.getMonth()+1)} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const fmtPer = (a,b) => { const x=new Date(a), y=new Date(b); return x.toDateString()===y.toDateString() ? `${fmt(a)} – ${pad(y.getHours())}:${pad(y.getMinutes())}` : `${fmt(a)} → ${fmt(b)}`; };
const nextHour = () => { const d = new Date(); d.setMinutes(0,0,0); d.setHours(d.getHours()+1); return d; };
const num = n => Number(n||0).toLocaleString('pt-BR');

function msg(el, text, kind='err'){ $(el).innerHTML = text ? `<div class="msg ${kind}">${esc(text)}</div>` : ''; }
function errText(e){ return e?.message || e?.error_description || String(e); }
function modal(html, wide){ $('#modal').innerHTML = `<div class="mod"><div class="card${wide ? ' wide' : ''}">${html}</div></div>`; $('#modal .mod').onclick = e => { if (e.target.classList.contains('mod')) closeModal(); }; }
function closeModal(){ $('#modal').innerHTML = ''; }

// ===== Auth =====
$('#goAtivar').onclick = () => { $('#boxLogin').classList.add('hide'); $('#boxAtivar').classList.remove('hide'); $('#aUser').value = $('#lUser').value; };
$('#goLogin').onclick = () => { $('#boxAtivar').classList.add('hide'); $('#boxLogin').classList.remove('hide'); };

$('#fLogin').onsubmit = async e => {
  e.preventDefault(); msg('#lMsg','');
  const btn = e.submitter; btn.disabled = true;
  const { error } = await sb.auth.signInWithPassword({ email: emailDe($('#lUser').value), password: $('#lPass').value });
  btn.disabled = false;
  if (error) return msg('#lMsg', error.message.includes('Invalid') ? 'E-mail ou senha incorretos. Primeiro acesso? Use "Ativar conta".' : errText(error));
  boot();
};

$('#fAtivar').onsubmit = async e => {
  e.preventDefault(); msg('#aMsg','');
  if ($('#aPass').value !== $('#aPass2').value) return msg('#aMsg','As senhas não conferem');
  const btn = e.submitter; btn.disabled = true;
  try {
    const r = await fetch(`${SUPABASE_URL}/functions/v1/reservas-ativar`, {
      method:'POST', headers:{ 'Content-Type':'application/json', apikey: SUPABASE_KEY },
      body: JSON.stringify({ empresa: EMPRESA, usuario: $('#aUser').value.trim(), codigo: $('#aCod').value.trim(), senha: $('#aPass').value })
    });
    const j = await r.json();
    if (!r.ok || j.erro) throw new Error(j.erro || 'Falha na ativação');
    const { error } = await sb.auth.signInWithPassword({ email: j.email, password: $('#aPass').value });
    if (error) throw error;
    boot();
  } catch (err) { msg('#aMsg', errText(err)); }
  btn.disabled = false;
};

$('#btnSair').onclick = async () => { await sb.auth.signOut(); location.reload(); };

async function boot(){
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { $('#vLogin').classList.remove('hide'); $('#vApp').classList.add('hide'); return; }
  const { data, error } = await sb.from('usuarios').select('*').eq('auth_id', session.user.id).maybeSingle();
  if (error || !data || !data.ativo) {
    await sb.auth.signOut();
    $('#vLogin').classList.remove('hide');
    return msg('#lMsg', error ? errText(error) : 'Este acesso está desativado. Fale com o gestor.');
  }
  ME = data;
  const [{ data: emp }] = await Promise.all([sb.from('empresas').select('*').single(), loadBase()]);
  EMP = emp;
  $('#vLogin').classList.add('hide'); $('#vApp').classList.remove('hide');
  $('#who').textContent = ME.nome + ({gestor:' · gestor', portaria:' · portaria'}[ME.papel] || '');
  const tabs = ME.papel === 'portaria' ? [['portaria','Portaria'],['agenda','Agenda']]
    : ME.papel === 'gestor' ? [['portaria','Portaria'],['nova','Nova reserva'],['minhas','Minhas reservas'],['agenda','Agenda'],['todas','Todas reservas'],['veiculos','Veículos'],['manut','Manutenção'],['usuarios','Usuários'],['relatorios','Relatórios'],['config','Configurações']]
    : [['nova','Nova reserva'],['minhas','Minhas reservas'],['agenda','Agenda']];
  if (!tabs.some(t => t[0] === TAB)) TAB = null;
  $('#nav').innerHTML = tabs.map(([k,l]) => `<button data-t="${k}">${l}</button>`).join('');
  $('#nav').onclick = e => { const t = e.target.dataset.t; if (t) go(t); };
  go(TAB || (ME.papel === 'portaria' ? 'portaria' : 'minhas'));
  if (ME.papel === 'gestor') atualizarBadgeManut();
}

async function loadBase(){
  const [c, v] = await Promise.all([
    sb.from('categorias').select('*').order('nome'),
    sb.from('veiculos').select('*, categoria:categorias(nome)').order('modelo')
  ]);
  CATS = c.data || []; VEIC = v.data || [];
}

function go(t){
  TAB = t;
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  ({portaria:vPortaria, nova:vNova, minhas:vMinhas, agenda:vAgenda, todas:vTodas, veiculos:vVeiculos, usuarios:vUsuarios, relatorios:vRelatorios, manut:vManut, config:vConfig})[t]();
}

const RES_SEL = '*, veiculo:veiculos(placa,modelo,km_atual), usuario:usuarios!reservas_usuario_id_fkey(nome,usuario)';

// ===== Nova reserva =====
function vNova(){
  const cfg = EMP.config, ini = nextHour(), fim = new Date(ini.getTime() + 2*3600e3);
  const maxIni = new Date(Date.now() + cfg.antecedencia_dias*864e5);
  const gestor = ME.papel === 'gestor';
  $('#main').innerHTML = `
  <div class="card"><h2>Nova reserva</h2>
    <div class="msg info">Máximo de ${+(cfg.max_horas/24).toFixed(1)} dias por reserva, com até ${cfg.antecedencia_dias} dias de antecedência. Se não retirar em ${cfg.noshow_min} min após o início, a reserva é liberada.${gestor?' Como gestor, você não tem esses limites.':''}</div>
    <div class="row">
      <div><label>Início</label><input type="datetime-local" id="nIni" step="900" value="${toLocalInput(ini)}" ${gestor?'':`max="${toLocalInput(maxIni)}"`}></div>
      <div><label>Fim</label><input type="datetime-local" id="nFim" step="900" value="${toLocalInput(fim)}"></div>
    </div>
    <div class="row">
      <div><label>Categoria</label><select id="nCat"><option value="">Todas</option>${CATS.filter(c=>c.ativo).map(c=>`<option value="${c.id}">${esc(c.nome)}</option>`).join('')}</select></div>
      <div><label>Destino / motivo</label><input id="nDest" placeholder="Opcional"></div>
    </div>
    ${gestor ? `<label>Reservar para</label><select id="nPara"><option value="">Eu mesmo</option></select>` : ''}
    <div id="nMsg"></div>
  </div>
  <div class="card"><h2>Escolha o veículo</h2><div id="nVeic" class="list"></div>
    <button class="btn full" id="nBtn" disabled>Confirmar reserva</button></div>`;
  if (gestor) sb.from('usuarios').select('id,nome,usuario,papel').eq('ativo',true).order('nome').then(({data}) => {
    $('#nPara').innerHTML += (data||[]).filter(u=>u.id!==ME.id && u.papel!=='portaria').map(u=>`<option value="${u.id}">${esc(u.nome)} (${esc(u.usuario)})</option>`).join('');
  });
  let sel = null;
  const refresh = async () => {
    sel = null; $('#nBtn').disabled = true; msg('#nMsg','');
    const a = new Date($('#nIni').value), b = new Date($('#nFim').value);
    if (isNaN(a) || isNaN(b) || b <= a) { $('#nVeic').innerHTML = '<div class="empty">Informe um período válido</div>'; return; }
    const horas = (b - a)/36e5;
    if (!gestor && horas > cfg.max_horas) msg('#nMsg', `Período de ${+(horas/24).toFixed(1)} dias passa do máximo permitido`);
    const { data: oc } = await sb.from('reservas').select('veiculo_id,inicio,fim,usuario:usuarios!reservas_usuario_id_fkey(nome)')
      .in('status',['reservada','em_uso']).lt('inicio', b.toISOString()).gt('fim', a.toISOString());
    const ocup = {}; (oc||[]).forEach(r => ocup[r.veiculo_id] = r);
    const { data: bl } = await sb.from('bloqueios').select('veiculo_id,inicio,fim,motivo').eq('ativo',true).lt('inicio', b.toISOString()).gt('fim', a.toISOString());
    (bl||[]).forEach(x => ocup[x.veiculo_id] = { ...x, bloq: true });
    const cat = $('#nCat').value;
    const lista = VEIC.filter(v => v.ativo && (!cat || v.categoria_id === cat));
    lista.sort((x,y) => (!!ocup[x.id]) - (!!ocup[y.id]));
    $('#nVeic').innerHTML = lista.length ? lista.map(v => {
      const o = ocup[v.id];
      return `<div class="item veic ${o?'ocup':''}" data-id="${v.id}">
        <div class="grow"><div class="t">${esc(v.modelo)} · ${esc(v.placa)}</div>
        <div class="s">${esc(v.categoria?.nome||'Sem categoria')}${v.descricao?' · '+esc(v.descricao):''}</div></div>
        ${o ? (o.bloq ? `<span class="tag">Bloqueado: ${esc(o.motivo)}</span>` : `<span class="tag cancelada">Ocupado ${fmtPer(o.inicio,o.fim)}</span>`) : '<span class="tag concluida">Livre</span>'}</div>`;
    }).join('') : '<div class="empty">Nenhum veículo nessa categoria</div>';
    $('#nVeic').querySelectorAll('.veic:not(.ocup)').forEach(el => el.onclick = () => {
      $('#nVeic').querySelectorAll('.veic').forEach(x => x.classList.remove('sel'));
      el.classList.add('sel'); sel = el.dataset.id; $('#nBtn').disabled = false;
    });
  };
  ['#nIni','#nFim','#nCat'].forEach(s => $(s).onchange = refresh);
  $('#nIni').addEventListener('change', () => {
    const a = new Date($('#nIni').value), b = new Date($('#nFim').value);
    if (!isNaN(a) && (isNaN(b) || b <= a)) { $('#nFim').value = toLocalInput(new Date(a.getTime()+2*3600e3)); refresh(); }
  });
  $('#nBtn').onclick = async () => {
    $('#nBtn').disabled = true;
    const { error } = await sb.rpc('criar_reserva', {
      p_veiculo: sel, p_inicio: new Date($('#nIni').value).toISOString(), p_fim: new Date($('#nFim').value).toISOString(),
      p_destino: $('#nDest').value || null, p_usuario: (gestor && $('#nPara').value) || null });
    if (error) { msg('#nMsg', errText(error)); $('#nBtn').disabled = false; return; }
    go('minhas'); setTimeout(() => msg('#mMsg','Reserva confirmada!','ok'), 50);
  };
  refresh();
}

// ===== Item de reserva com ações =====
function resItem(r, opts={}){
  const agora = Date.now(), ini = new Date(r.inicio).getTime(), ant = (EMP.config.retirada_antecipada_min||30)*6e4;
  const staff = ME.papel === 'gestor' || ME.papel === 'portaria';
  const podeRet = staff && r.status === 'reservada' && agora >= ini - ant && agora < new Date(r.fim).getTime();
  const proxima = !staff && r.status === 'reservada' && agora >= ini - ant;
  const atrasada = r.status === 'em_uso' && agora > new Date(r.fim).getTime();
  const km = r.km_retorno != null ? ` · ${num(r.km_retorno - r.km_saida)} km rodados` : r.km_saida != null ? ` · saiu com ${num(r.km_saida)} km` : '';
  return `<div class="item">
    <div class="grow"><div class="t">${esc(r.veiculo?.modelo)} · ${esc(r.veiculo?.placa)}</div>
      <div class="s">${fmtPer(r.inicio, r.fim)}${opts.quem ? ' · '+esc(r.usuario?.nome) : ''}${r.destino ? ' · '+esc(r.destino) : ''}${km}</div>
      ${r.obs_devolucao ? `<div class="s">Obs: ${esc(r.obs_devolucao)}</div>` : ''}
      ${r.motivo_cancelamento && r.status === 'cancelada' ? `<div class="s">${esc(r.motivo_cancelamento)}</div>` : ''}
      ${proxima ? `<div class="s" style="color:var(--pri)">Retire a chave na portaria</div>` : ''}</div>
    <span class="tag ${r.status}">${STATUS[r.status]}${atrasada?' · atrasada':''}</span>
    ${podeRet ? `<button class="btn sm ok" data-a="ret" data-id="${r.id}">Entregar chave</button>` : ''}
    ${staff && r.status === 'em_uso' ? `<button class="btn sm" data-a="dev" data-id="${r.id}">Receber chave</button>` : ''}
    ${r.status === 'reservada' && (ME.papel === 'gestor' || r.usuario_id === ME.id) ? `<button class="btn sm sec" data-a="can" data-id="${r.id}">Cancelar</button>` : ''}
  </div>`;
}

function bindAcoes(root, rows, reload){
  root.onclick = e => {
    const b = e.target.closest('button[data-a]'); if (!b) return;
    const r = rows.find(x => x.id === b.dataset.id); if (!r) return;
    if (b.dataset.a === 'can') return confirmar(`Cancelar a reserva do ${r.veiculo.modelo} em ${fmtPer(r.inicio,r.fim)}?`, async () => {
      const { error } = await sb.rpc('cancelar_reserva', { p_id: r.id }); if (error) throw error; reload(); });
    if (b.dataset.a === 'ret') return pedirKm('Entregar chave', `${r.veiculo.modelo} · ${r.veiculo.placa} → ${r.usuario?.nome || ''}`, `Último KM registrado: ${num(r.veiculo.km_atual)}`, r.veiculo.km_atual, false,
      async (km) => { const { error } = await sb.rpc('retirar', { p_id: r.id, p_km: km }); if (error) throw error; reload(); });
    if (b.dataset.a === 'dev') return pedirKm('Receber chave', `${r.veiculo.modelo} · ${r.veiculo.placa} ← ${r.usuario?.nome || ''}`, `KM de saída: ${num(r.km_saida)}`, '', true,
      async (km, obs) => { const { error } = await sb.rpc('devolver', { p_id: r.id, p_km: km, p_obs: obs }); if (error) throw error; reload(); });
  };
}

function confirmar(texto, fn){
  modal(`<h2>Confirmar</h2><p>${esc(texto)}</p><div id="cMsg"></div>
    <div class="row"><button class="btn sec" id="cNo">Voltar</button><button class="btn err" id="cYes">Confirmar</button></div>`);
  $('#cNo').onclick = closeModal;
  $('#cYes').onclick = async () => { $('#cYes').disabled = true; try { await fn(); closeModal(); } catch (e) { msg('#cMsg', errText(e)); $('#cYes').disabled = false; } };
}

function pedirKm(titulo, veic, dica, valor, comObs, fn){
  modal(`<h2>${titulo}</h2><p style="margin:0"><b>${esc(veic)}</b></p><p class="s" style="color:var(--mut);margin:4px 0 0">${esc(dica)}</p>
    <label>KM do painel</label><input id="kKm" type="number" inputmode="numeric" min="0" value="${valor}">
    ${comObs ? `<label>Observação (opcional)</label><textarea id="kObs" rows="2" placeholder="Algum problema com o veículo?"></textarea>` : ''}
    <div id="kMsg"></div>
    <div class="row" style="margin-top:12px"><button class="btn sec" id="kNo">Voltar</button><button class="btn ok" id="kYes">Confirmar</button></div>`);
  $('#kKm').focus();
  $('#kNo').onclick = closeModal;
  $('#kYes').onclick = async () => {
    const km = parseInt($('#kKm').value, 10);
    if (isNaN(km)) return msg('#kMsg','Informe o KM');
    $('#kYes').disabled = true;
    try { await fn(km, comObs ? $('#kObs').value : null); closeModal(); }
    catch (e) { msg('#kMsg', errText(e)); $('#kYes').disabled = false; }
  };
}

async function vAgenda(){
  const dia = window._agDia || toDateInput(new Date());
  $('#main').innerHTML = `<div class="card">
    <div class="toolbar">
      <div><label>Dia</label><input type="date" id="agD" value="${dia}"></div>
      <div><label>Categoria</label><select id="agC"><option value="">Todas</option>${CATS.map(c=>`<option value="${c.id}">${esc(c.nome)}</option>`).join('')}</select></div>
      <button class="btn sec" id="agP">‹</button><button class="btn sec" id="agN">›</button>
    </div>
    <div class="ag"><div class="ag-grid" id="agG"><div class="empty">Carregando…</div></div></div></div>`;
  const shift = d => { const x = new Date($('#agD').value+'T12:00'); x.setDate(x.getDate()+d); window._agDia = toDateInput(x); vAgenda(); };
  $('#agP').onclick = () => shift(-1); $('#agN').onclick = () => shift(1);
  $('#agD').onchange = () => { window._agDia = $('#agD').value; vAgenda(); };
  const draw = async () => {
    const a = new Date($('#agD').value+'T00:00'), b = new Date(a.getTime() + 864e5);
    const { data } = await sb.from('reservas').select(RES_SEL).in('status',['reservada','em_uso']).lt('inicio', b.toISOString()).gt('fim', a.toISOString());
    const cat = $('#agC').value;
    const vs = VEIC.filter(v => v.ativo && (!cat || v.categoria_id === cat));
    const por = {}; (data||[]).forEach(r => (por[r.veiculo_id] ||= []).push(r));
    const { data: bl } = await sb.from('bloqueios').select('*').eq('ativo',true).lt('inicio', b.toISOString()).gt('fim', a.toISOString());
    (bl||[]).forEach(x => (por[x.veiculo_id] ||= []).push({ ...x, status: 'bloq', usuario: { nome: x.motivo } }));
    $('#agG').innerHTML = `<div class="ag-head"><div></div><div class="ag-hours">${Array.from({length:24},(_,h)=>`<span>${h}</span>`).join('')}</div></div>` +
      (vs.length ? vs.map(v => `<div class="ag-row"><div class="nm">${esc(v.modelo)}<small>${esc(v.placa)}</small></div><div class="ag-tl">${
        (por[v.id]||[]).map(r => {
          const s = Math.max(0, (new Date(r.inicio) - a)/864e5), e = Math.min(1, (new Date(r.fim) - a)/864e5);
          return `<div class="ag-bar ${r.status}" style="left:${s*100}%;width:${(e-s)*100}%" title="${esc(r.usuario?.nome)} · ${fmtPer(r.inicio,r.fim)}">${esc(r.usuario?.nome?.split(' ')[0])}</div>`;
        }).join('')}</div></div>`).join('') : '<div class="empty">Nenhum veículo</div>');
  };
  $('#agC').onchange = draw; draw();
}

    <label><input type="checkbox" id="fvA" style="width:auto" ${v.ativo?'checked':''}> Ativo (disponível para reserva)</label>` : ''}

    const { data, error } = await sb.rpc('excluir_veiculo', { p_id: v.id }); if (error) throw error; await loadBase(); vVeiculos(); });
  $('#fvS').onclick = async () => {

      descricao: $('#fvD').value.trim() || null, km_atual: parseInt($('#fvK').value,10) || 0 };

    if (error) return msg('#fvMsg', error.code === '23505' ? 'Já existe um veículo com essa placa' : errText(error));
    closeModal(); vVeiculos();
  };
}

      <button class="btn sec" id="uImp">Importar planilha</button><button class="btn sec" id="uCod">Códigos pendentes</button><button class="btn" id="uAdd">+ Usuário</button></div>
    <div class="stat" id="uStat"></div><div class="list" id="uL"><div class="empty">Carregando…</div></div></div>`;
  const [{ data }, { data: cd }] = await Promise.all([sb.from('usuarios').select('*').order('nome'), sb.from('condutores').select('usuario_id,cargo,setor,cnh_validade,cpf')]);

  const draw = () => {
    const t = $('#uQ').value.trim().toLowerCase();
    const f = $('#uF').value;
    const l = us.filter(u => (!t || [u.nome, u.usuario, CD[u.id]?.setor, CD[u.id]?.cargo, CD[u.id]?.cpf].join(' ').toLowerCase().includes(t))
      && (!f || (f === 'pendente' ? u.status === 'pendente' : f === 'cnh' ? ['vencida','vence'].includes(cnhSit(u)) : f === 'semcnh' ? cnhSit(u) === 'sem' : u.papel === f)));
    $('#uL').innerHTML = l.map(u => { const c = CD[u.id], s = cnhSit(u); return `<div class="item"><div class="grow"><div class="t">${esc(u.nome)}</div><div class="s">${esc(u.usuario)}${c?.cargo || c?.setor ? ' · ' + esc([c.cargo, c.setor].filter(Boolean).join(' · ')) : ''}</div></div>
      ${s === 'vencida' ? '<span class="tag cancelada">CNH vencida</span>' : s === 'vence' ? '<span class="tag alerta">CNH vence em breve</span>' : ''}
      ${u.papel==='gestor'?'<span class="tag gestor">Gestor</span>':''}${u.papel==='portaria'?'<span class="tag portaria">Portaria</span>':''}${u.status==='pendente'?'<span class="tag pendente">Pendente</span>':''}${u.ativo?'':'<span class="tag cancelada">Desativado</span>'}

  modal(`<h2>Código de acesso</h2><p style="margin:0">Passe para <b>${esc(nome)}</b>:</p>

    <p style="font-size:13px;color:var(--mut)">Vale por 7 dias. Este código não aparece de novo; se perder, gere outro em "Redefinir senha".</p>
    <button class="btn full" id="mcCopy">Copiar mensagem</button><button class="btn sec full" onclick="closeModal();vUsuarios()">Fechar</button>`);
  $('#mcCopy').onclick = () => { navigator.clipboard?.writeText(`Acesso ao sistema de reserva de veículos:\n${url}\nToque em "Ativar conta"\nE-mail: ${usuario}\nCódigo: ${codigo}\n(válido por 7 dias)`); $('#mcCopy').textContent = 'Copiado!'; };

const soDig = s => String(s || '').replace(/\D/g, '');
const cpfValido = c => { c = soDig(c); if (c.length !== 11 || /^(\d)\1{10}$/.test(c)) return false;
  const dv = n => { let s = 0; for (let i = 0; i < n; i++) s += +c[i] * (n + 1 - i); const r = (s * 10) % 11; return r === 10 ? 0 : r; };
  return dv(9) === +c[9] && dv(10) === +c[10]; };
const fmtCPF = c => { c = soDig(c); return c.length === 11 ? c.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4') : c; };
const fmtCEP = c => { c = soDig(c); return c.length === 8 ? c.replace(/(\d{5})(\d{3})/, '$1-$2') : c; };
const UFS = 'AC AL AP AM BA CE DF ES GO MA MT MS MG PA PB PR PE PI RJ RN RS RO RR SC SP SE TO'.split(' ');

async function formUsuario(u){
  let c = {};
  if (u) { const { data } = await sb.from('condutores').select('*').eq('usuario_id', u.id).maybeSingle(); c = data || {}; }
  const f = (id, label, val, attrs = '') => `<div><label>${label}</label><input id="${id}" value="${esc(val ?? '')}" ${attrs}></div>`;
  const dt = (id, label, val, attrs = '') => f(id, label, val, `type="date" ${attrs}`);
  modal(`<h2>${u ? esc(u.nome) : 'Novo usuário'}</h2>
    <fieldset class="fs"><legend>Acesso</legend>
      <label>Nome completo</label><input id="fuN" value="${esc(u?.nome || '')}">
      <div class="row">
        <div><label>E-mail (login)</label><input id="fuU" type="text" inputmode="email" value="${esc(u?.usuario || '')}" autocapitalize="none" spellcheck="false" ${u?.auth_id ? 'disabled' : ''} placeholder="nome.sobrenome@cipatex.com.br"></div>
        <div><label>Papel</label><select id="fuP"><option value="usuario">Motorista</option><option value="portaria" ${u?.papel === 'portaria' ? 'selected' : ''}>Portaria (entrega e recebe chaves)</option><option value="gestor" ${u?.papel === 'gestor' ? 'selected' : ''}>Gestor</option></select></div>
      </div>
      ${u ? `<label class="chk"><input type="checkbox" id="fuA" ${u.ativo ? 'checked' : ''}> Ativo</label>` : ''}
      ${u?.auth_id ? '<p class="hint" style="margin:4px 0 0">O login não pode mudar depois do primeiro acesso.</p>' : ''}
    </fieldset>
    <fieldset class="fs"><legend>Dados pessoais</legend>
      <div class="row3">${f('cCargo', 'Cargo / função', c.cargo)}${f('cSetor', 'Setor', c.setor)}${dt('cNasc', 'Data de nascimento', c.data_nascimento, `max="${hojeISO()}"`)}</div>
      <div class="row3">${f('cCpf', 'CPF', fmtCPF(c.cpf), 'inputmode="numeric" placeholder="000.000.000-00"')}${f('cRg', 'RG', c.rg)}${f('cRgO', 'Órgão emissor', c.rg_orgao, 'placeholder="SSP/SP"')}</div>
      <div class="row">${f('cTel', 'Telefone / WhatsApp', c.telefone, 'inputmode="tel" placeholder="(15) 99999-9999"')}${f('cEmail', 'E-mail pessoal (opcional)', c.email_contato, 'inputmode="email"')}</div>
    </fieldset>
    <fieldset class="fs"><legend>Endereço</legend>
      <div class="row3">${f('cCep', 'CEP', fmtCEP(c.cep), 'inputmode="numeric" placeholder="00000-000"')}<div style="grid-column:span 2"><label>Rua</label><input id="cRua" value="${esc(c.logradouro || '')}"></div></div>
      <div class="row3">${f('cNum', 'Número', c.numero)}${f('cComp', 'Complemento', c.complemento)}${f('cBai', 'Bairro', c.bairro)}</div>
      <div class="row">${f('cCid', 'Cidade', c.cidade)}<div><label>UF</label><select id="cUf"><option value=""></option>${UFS.map(x => `<option ${x === (c.uf || '') ? 'selected' : ''}>${x}</option>`).join('')}</select></div></div>
    </fieldset>
    <fieldset class="fs"><legend>CNH</legend>
      <div class="row3">${f('cCnh', 'Nº registro', c.cnh_numero, 'inputmode="numeric"')}<div><label>Categoria</label><select id="cCat">${['', 'A', 'B', 'AB', 'C', 'AC', 'D', 'AD', 'E', 'AE'].map(x => `<option ${x === (c.cnh_categoria || '') ? 'selected' : ''}>${x}</option>`).join('')}</select></div>${dt('cPri', '1ª habilitação', c.cnh_primeira_habilitacao)}</div>
      <div class="row">${dt('cExp', 'Data de expedição', c.cnh_expedicao)}${dt('cVal', 'Validade', c.cnh_validade)}</div>
      <div id="cnhAviso"></div>
    </fieldset>
    <fieldset class="fs"><legend>Observações</legend><textarea id="cObs" rows="2">${esc(c.observacoes || '')}</textarea></fieldset>
    <p class="hint">Dados pessoais só ficam visíveis para gestores.</p>
    <div id="fuM"></div>
    <div class="row" style="margin-top:12px"><button class="btn sec" onclick="closeModal()">Voltar</button><button class="btn" id="fuS">Salvar</button></div>
    ${u && u.id !== ME.id ? `<button class="btn sec full" id="fuR">${u.status === 'pendente' ? 'Gerar código de acesso' : 'Redefinir senha (gerar novo código)'}</button>` : ''}`, true);

  const avisoCnh = () => { const v = $('#cVal').value; if (!v) return $('#cnhAviso').innerHTML = '';
    const n = diasAte(v); $('#cnhAviso').innerHTML = n < 0 ? `<div class="msg err">CNH vencida há ${-n} dia(s).</div>` : n <= 30 ? `<div class="msg info">CNH vence em ${n} dia(s).</div>` : ''; };
  $('#cVal').onchange = avisoCnh; avisoCnh();
  $('#cCpf').onblur = () => { $('#cCpf').value = fmtCPF($('#cCpf').value); };
  $('#cCep').onblur = async () => {
    const cep = soDig($('#cCep').value); $('#cCep').value = fmtCEP(cep);
    if (cep.length !== 8 || $('#cRua').value) return;
    try { const r = await fetch(`https://viacep.com.br/ws/${cep}/json/`); const j = await r.json();
      if (!j.erro) { $('#cRua').value = j.logradouro || ''; $('#cBai').value = j.bairro || ''; $('#cCid').value = j.localidade || ''; $('#cUf').value = j.uf || ''; $('#cNum').focus(); }
    } catch (e) {}
  };

  $('#fuS').onclick = async () => {
    const nome = $('#fuN').value.trim(), usuario = $('#fuU').value.trim().toLowerCase();
    if (nome.length < 2) return msg('#fuM', 'Informe o nome');
    if (!/^[a-z0-9._-]{3,40}$/.test(usuario) && !/^[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$/.test(usuario)) return msg('#fuM', 'Informe um e-mail válido para o login');
    const cpf = soDig($('#cCpf').value);
    if (cpf && !cpfValido(cpf)) return msg('#fuM', 'CPF inválido. Confira os números.');
    const exp = $('#cExp').value, val = $('#cVal').value;
    if (exp && val && val <= exp) return msg('#fuM', 'A validade da CNH precisa ser depois da expedição.');
    $('#fuS').disabled = true;
    const r1 = await sb.rpc('salvar_usuario', { p_id: u?.id || null, p_nome: nome, p_usuario: usuario, p_papel: $('#fuP').value, p_ativo: u ? $('#fuA').checked : true });
    if (r1.error) { $('#fuS').disabled = false; return msg('#fuM', errText(r1.error)); }
    const id = u?.id || r1.data.id;
    const r2 = await sb.rpc('salvar_condutor', { p_usuario: id, p: { cargo: $('#cCargo').value, setor: $('#cSetor').value, data_nascimento: $('#cNasc').value, cpf,
      rg: $('#cRg').value, rg_orgao: $('#cRgO').value, telefone: $('#cTel').value, email_contato: $('#cEmail').value, cep: $('#cCep').value,
      logradouro: $('#cRua').value, numero: $('#cNum').value, complemento: $('#cComp').value, bairro: $('#cBai').value, cidade: $('#cCid').value, uf: $('#cUf').value,
      cnh_numero: $('#cCnh').value, cnh_categoria: $('#cCat').value, cnh_expedicao: exp, cnh_validade: val, cnh_primeira_habilitacao: $('#cPri').value, observacoes: $('#cObs').value } });
    $('#fuS').disabled = false;
    if (r2.error) { if (!u) u = { id, nome, usuario, papel: $('#fuP').value, ativo: true, status: 'pendente' }; return msg('#fuM', (u ? 'Acesso salvo, mas os dados pessoais não: ' : '') + errText(r2.error)); }
    if (!u && r1.data?.codigo) return mostrarCodigo(nome, usuario, r1.data.codigo);
    closeModal(); vUsuarios();
  };
  if ($('#fuR')) $('#fuR').onclick = async () => {
    const { data, error } = await sb.rpc('redefinir_senha', { p_id: u.id });
    if (error) return msg('#fuM', errText(error));
    mostrarCodigo(u.nome, u.usuario, data);
  };
}

// ===== Portaria =====
let _ptTimer = null;
async function vPortaria(){
  clearInterval(_ptTimer);
  $('#main').innerHTML = `<div id="pMsg"></div>
    <div class="card">
      <div class="toolbar"><div><input id="pQ" placeholder="Buscar motorista, placa ou modelo"></div><button class="btn sec" id="pR">Atualizar</button></div>
      <div class="stat" id="pStat"></div>
      <div class="sec-h">Para entregar a chave</div><div class="list" id="pEnt"><div class="empty">Carregando…</div></div>
      <div class="sec-h">Na rua (receber a chave)</div><div class="list" id="pRec"></div>
    </div>`;
  let rows = [];
  const load = async () => {
    const fimDia = new Date(); fimDia.setHours(23,59,59,999);
    const [a, b] = await Promise.all([
      sb.from('reservas').select(RES_SEL).eq('status','reservada').lt('inicio', fimDia.toISOString()).order('inicio'),
      sb.from('reservas').select(RES_SEL).eq('status','em_uso').order('fim')
    ]);
    if (a.error || b.error) return msg('#pMsg', errText(a.error || b.error));
    rows = [...a.data, ...b.data];
    draw();
  };
  const draw = () => {
    if (TAB !== 'portaria') return clearInterval(_ptTimer);
    const t = ($('#pQ')?.value || '').trim().toLowerCase();
    const f = r => !t || [r.usuario?.nome, r.veiculo?.placa, r.veiculo?.modelo].join(' ').toLowerCase().includes(t);
    const agora = Date.now(), ant = (EMP.config.retirada_antecipada_min || 30) * 6e4;
    const ent = rows.filter(r => r.status === 'reservada' && f(r));
    const rec = rows.filter(r => r.status === 'em_uso' && f(r));
    const atrasados = rows.filter(r => r.status === 'em_uso' && new Date(r.fim) < agora).length;
    $('#pStat').innerHTML = `<div><b>${rows.filter(r=>r.status==='reservada').length}</b><span>Retiradas hoje</span></div>
      <div><b>${rows.filter(r=>r.status==='em_uso').length}</b><span>Veículos na rua</span></div>
      <div><b style="color:${atrasados?'var(--err)':'inherit'}">${atrasados}</b><span>Devolução atrasada</span></div>`;
    $('#pEnt').innerHTML = ent.length ? ent.map(r => {
      const libera = agora >= new Date(r.inicio).getTime() - ant;
      return `<div class="pt-item"><div class="grow"><div class="t">${esc(r.usuario?.nome)}</div>
        <div class="s"><b>${esc(r.veiculo?.modelo)} · ${esc(r.veiculo?.placa)}</b> · ${fmtPer(r.inicio, r.fim)}${r.destino ? ' · ' + esc(r.destino) : ''}</div></div>
        ${libera ? `<button class="btn ok" data-a="ret" data-id="${r.id}">Entregar chave</button>` : `<span class="tag">Libera às ${fmt(new Date(new Date(r.inicio).getTime() - ant).toISOString()).slice(6)}</span>`}</div>`;
    }).join('') : '<div class="empty">Nenhuma retirada pendente hoje</div>';
    $('#pRec').innerHTML = rec.length ? rec.map(r => {
      const late = new Date(r.fim) < agora;
      return `<div class="pt-item ${late?'late':''}"><div class="grow"><div class="t">${esc(r.usuario?.nome)}</div>
        <div class="s"><b>${esc(r.veiculo?.modelo)} · ${esc(r.veiculo?.placa)}</b> · devolução ${fmt(r.fim)} · saiu com ${num(r.km_saida)} km</div>
        ${late ? '<div class="s" style="color:var(--err);font-weight:600">Devolução atrasada</div>' : ''}</div>
        <button class="btn" data-a="dev" data-id="${r.id}">Receber chave</button></div>`;
    }).join('') : '<div class="empty">Nenhum veículo na rua</div>';
  };
  const box = $('#main');
  box.onclick = e => {
    const b = e.target.closest('button[data-a]'); if (!b) return;
    const r = rows.find(x => x.id === b.dataset.id); if (!r) return;
    if (b.dataset.a === 'ret') pedirKm('Entregar chave', `${r.veiculo.modelo} · ${r.veiculo.placa} → ${r.usuario?.nome}`, `Confira o painel. Último KM registrado: ${num(r.veiculo.km_atual)}`, r.veiculo.km_atual, false,
      async km => { const { error } = await sb.rpc('retirar', { p_id: r.id, p_km: km }); if (error) throw error; await loadBase(); load(); });

      async (km, obs) => { const { error } = await sb.rpc('devolver', { p_id: r.id, p_km: km, p_obs: obs }); if (error) throw error; await loadBase(); load(); });

let _xlsx = null;
function loadXLSX(){
  if (window.XLSX) return Promise.resolve(window.XLSX);
  return _xlsx ||= new Promise((ok, fail) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = () => ok(window.XLSX); s.onerror = () => { _xlsx = null; fail(new Error('Não foi possível carregar o leitor de planilhas')); };
    document.head.appendChild(s);
  });
}
const normKey = k => String(k).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim().replace(/[^a-z0-9]/g,'');
async function lerPlanilha(file, mapa){
  const X = await loadXLSX();
  const wb = X.read(await file.arrayBuffer(), { type: 'array' });
  const ws = wb.Sheets[wb.SheetNames[0]];
  const raw = X.utils.sheet_to_json(ws, { defval: '', raw: false });
  return raw.map(r => { const o = {}; for (const [k, v] of Object.entries(r)) { const c = mapa[normKey(k)]; if (c) o[c] = String(v).trim(); } return o; })
            .filter(o => Object.values(o).some(v => v));
}
async function baixarXLSX(nome, abas){
  const X = await loadXLSX(); const wb = X.utils.book_new();
  for (const [aba, linhas, larg] of abas) {
    const ws = X.utils.json_to_sheet(linhas);
    if (larg) ws['!cols'] = larg.map(w => ({ wch: w }));
    X.utils.book_append_sheet(wb, ws, aba);
  }
  X.writeFile(wb, nome);
}

const fmtXls = iso => { const d = new Date(iso); return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };

const brl = v => (+v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const fmtD = d => d ? d.split('-').reverse().join('/') : '';
const hojeISO = () => toDateInput(new Date());
const diasAte = d => Math.round((new Date(d + 'T00:00') - new Date(hojeISO() + 'T00:00')) / 864e5);
const SIT = { vencido: 'Vencido', alerta: 'Vence em breve', ok: 'Em dia' };
const OS_ST = { aberta: 'Aberta', em_andamento: 'Em andamento', concluida: 'Concluída', cancelada: 'Cancelada' };
const docSit = d => { const n = diasAte(d.vencimento); return n < 0 ? 'vencido' : n <= d.aviso_dias ? 'alerta' : 'ok'; };
const vNome = id => { const v = VEIC.find(x => x.id === id); return v ? `${v.modelo} · ${v.placa}` : '?'; };
const prazoTxt = s => [s.intervalo_km ? (s.faltam_km <= 0 ? `${num(-s.faltam_km)} km atrasado` : `faltam ${num(s.faltam_km)} km`) : null,
                       s.intervalo_meses ? (s.faltam_dias < 0 ? `venceu há ${-s.faltam_dias} dia(s)` : `faltam ${s.faltam_dias} dia(s)`) : null].filter(Boolean).join(' · ');
let MD = null;

async function carregarManut(){
  const [sit, ord, oco, doc, pla] = await Promise.all([
    sb.rpc('manut_situacao'),
    sb.from('manut_ordens').select('*').order('criado_em', { ascending: false }).limit(1000),
    sb.from('ocorrencias').select('*').order('criado_em', { ascending: false }).limit(300),
    sb.from('documentos').select('*').eq('ativo', true).order('vencimento'),
    sb.from('manut_planos').select('*').order('nome')
  ]);
  const err = sit.error || ord.error || oco.error || doc.error || pla.error; if (err) throw err;
  MD = { sit: sit.data, ord: ord.data, oco: oco.data, doc: doc.data, pla: pla.data };
  return MD;
}

  try { await loadBase(); await carregarManut(); } catch (e) { return msg('#maMsg', errText(e)); }
  const pend = MD.oco.filter(o => o.status === 'pendente').length;
  const abertas = MD.ord.filter(o => ['aberta','em_andamento'].includes(o.status)).length;
  $('#maNav').innerHTML = [['painel','Painel'],['ordens','Ordens de serviço', abertas],['planos','Planos preventivos'],['documentos','Documentos'],['ocorrencias','Ocorrências', pend]]
    .map(([k, l, n]) => `<button data-s="${k}" class="${k === window._mSub ? 'on' : ''}">${l}${n ? `<span class="n">${n}</span>` : ''}</button>`).join('');
  $('#maNav').onclick = e => { const b = e.target.closest('button[data-s]'); if (b) vManut(b.dataset.s); };
  ({ painel: mPainel, ordens: mOrdens, planos: mPlanos, documentos: mDocs, ocorrencias: mOcorr })[window._mSub]();
  atualizarBadgeManut();
}

function mPainel(){
  const ini = hojeISO().slice(0, 8) + '01';
  const custoMes = MD.ord.filter(o => o.status === 'concluida' && o.data_conclusao >= ini && !o.registro_anterior).reduce((s, o) => s + (+o.valor_pecas||0) + (+o.valor_mao_obra||0), 0);
  const venc = MD.sit.filter(s => s.situacao === 'vencido'), alert = MD.sit.filter(s => s.situacao === 'alerta');
  const docsV = MD.doc.filter(d => docSit(d) === 'vencido'), docsA = MD.doc.filter(d => docSit(d) === 'alerta');
  const pend = MD.oco.filter(o => o.status === 'pendente');
  const emOS = MD.ord.filter(o => ['aberta','em_andamento'].includes(o.status));
  const estimados = MD.sit.filter(s => s.estimado).length;
  const itens = [
    ...venc.map(s => ({ c: 'vencido', t: `${s.plano}`, v: s.veiculo_id, s: prazoTxt(s) + (s.estimado ? ' · <i>estimado</i>' : ''), a: `<button class="btn sm" data-a="os" data-v="${s.veiculo_id}" data-p="${s.plano_id}">Abrir OS</button>${s.estimado ? `<button class="btn sm sec" data-a="ult" data-v="${s.veiculo_id}" data-p="${s.plano_id}">Informar último serviço</button>` : ''}` })),
    ...docsV.map(d => ({ c: 'vencido', t: d.tipo + ' vencido', v: d.veiculo_id, s: `venceu em ${fmtD(d.vencimento)}`, a: `<button class="btn sm" data-a="ren" data-d="${d.id}">Renovar</button>` })),
    ...pend.map(o => ({ c: 'alerta', t: 'Ocorrência: ' + o.descricao, v: o.veiculo_id, s: fmt(o.criado_em), a: `<button class="btn sm" data-a="oco" data-o="${o.id}">Abrir OS corretiva</button>` })),
    ...alert.map(s => ({ c: 'alerta', t: s.plano, v: s.veiculo_id, s: prazoTxt(s) + (s.estimado ? ' · <i>estimado</i>' : ''), a: `<button class="btn sm sec" data-a="os" data-v="${s.veiculo_id}" data-p="${s.plano_id}">Abrir OS</button>${s.estimado ? `<button class="btn sm sec" data-a="ult" data-v="${s.veiculo_id}" data-p="${s.plano_id}">Informar último serviço</button>` : ''}` })),
    ...docsA.map(d => ({ c: 'alerta', t: d.tipo, v: d.veiculo_id, s: `vence em ${fmtD(d.vencimento)} (${diasAte(d.vencimento)} dias)`, a: `<button class="btn sm sec" data-a="ren" data-d="${d.id}">Renovar</button>` })),
  ];
  $('#maBody').innerHTML = `<div class="stat">
      <div><b style="color:${venc.length?'var(--err)':'inherit'}">${venc.length}</b><span>Preventivas vencidas</span></div>
      <div><b style="color:${alert.length?'var(--warn)':'inherit'}">${alert.length}</b><span>Vencem em breve</span></div>
      <div><b>${emOS.length}</b><span>OS abertas</span></div>
      <div><b style="color:${pend.length?'var(--warn)':'inherit'}">${pend.length}</b><span>Ocorrências pendentes</span></div>
      <div><b style="color:${docsV.length?'var(--err)':'inherit'}">${docsV.length + docsA.length}</b><span>Documentos vencidos/vencendo</span></div>
      <div><b>${brl(custoMes)}</b><span>Custo no mês</span></div></div>
    ${!MD.pla.length ? `<div class="msg info">Comece cadastrando os <b>planos preventivos</b> (ex.: troca de óleo a cada 10.000 km ou 6 meses). <button class="link" onclick="vManut('planos')">Cadastrar planos</button></div>` : ''}
    ${estimados ? `<p class="hint">${estimados} item(ns) estão com prazo <i>estimado</i> (contando a partir do cadastro do plano, porque ainda não há serviço registrado). Use "Informar último serviço" quando souber a data e o KM reais.</p>` : ''}
    <div class="card"><h2>Precisa de atenção</h2><div class="list" id="maAt">${itens.length ? itens.map(i => `<div class="item ${i.c}"><div class="grow"><div class="t">${esc(vNome(i.v))}</div><div class="s"><b>${esc(i.t)}</b> · ${i.s}</div></div>${i.a}</div>`).join('') : '<div class="empty">Tudo em dia 👍</div>'}</div></div>
    <div class="card"><h2>Situação por veículo</h2><div class="toolbar"><div><input id="maQ" placeholder="Buscar placa ou modelo"></div><button class="btn" id="maNova">+ Nova OS</button><button class="btn sec" id="maOco">+ Ocorrência</button></div><div class="list" id="maV"></div></div>`;
  const drawV = () => {
    const t = $('#maQ').value.trim().toLowerCase();
    const vs = VEIC.filter(v => v.ativo && (!t || (v.placa + ' ' + v.modelo).toLowerCase().includes(t)));
    const ordem = { vencido: 0, alerta: 1, ok: 2 };
    $('#maV').innerHTML = vs.length ? vs.map(v => {
      const ss = MD.sit.filter(s => s.veiculo_id === v.id).sort((a, b) => ordem[a.situacao] - ordem[b.situacao]);
      const os = MD.ord.find(o => o.veiculo_id === v.id && ['aberta','em_andamento'].includes(o.status));
      return `<div class="item"><div class="grow"><div class="t">${esc(v.modelo)} · ${esc(v.placa)} <span class="hint">${num(v.km_atual)} km</span></div>
        <div class="chips" style="margin-top:6px">${ss.map(s => `<span class="tag ${s.situacao}" title="${esc(prazoTxt(s))}">${esc(s.plano)}: ${s.situacao === 'ok' ? prazoTxt(s) : SIT[s.situacao]}</span>`).join('') || '<span class="hint">Nenhum plano se aplica</span>'}</div></div>
        ${os ? `<span class="tag em_uso">Em manutenção (OS ${os.numero})</span>` : ''}</div>`;
    }).join('') : '<div class="empty">Nenhum veículo</div>';
  };
  $('#maQ').oninput = drawV; drawV();
  $('#maNova').onclick = () => formOrdem(null, {});
  $('#maOco').onclick = formOcorrencia;
  $('#maAt').onclick = e => {
    const b = e.target.closest('button[data-a]'); if (!b) return;
    if (b.dataset.a === 'os') formOrdem(null, { veiculo_id: b.dataset.v, tipo: 'preventiva', planos: [b.dataset.p], descricao: MD.pla.find(p => p.id === b.dataset.p)?.nome });
    if (b.dataset.a === 'ult') formUltimo(b.dataset.v, b.dataset.p);
    if (b.dataset.a === 'ren') formDoc(null, MD.doc.find(d => d.id === b.dataset.d));
    if (b.dataset.a === 'oco') { const o = MD.oco.find(x => x.id === b.dataset.o); formOrdem(null, { veiculo_id: o.veiculo_id, tipo: 'corretiva', descricao: o.descricao, ocorrencia_id: o.id }); }
  };
}

function formUltimo(vid, pid){
  const v = VEIC.find(x => x.id === vid), p = MD.pla.find(x => x.id === pid);
  modal(`<h2>Último serviço realizado</h2><p style="margin:0"><b>${esc(p.nome)}</b> · ${esc(v.modelo)} · ${esc(v.placa)}</p>
    <p class="hint">Informe quando foi feito pela última vez. O próximo vencimento passa a contar daí.</p>
    <div class="row"><div><label>Data</label><input type="date" id="fuD" max="${hojeISO()}"></div><div><label>KM na época</label><input type="number" id="fuK" min="0" inputmode="numeric"></div></div>
    <div id="fuMsg"></div><div class="row" style="margin-top:12px"><button class="btn sec" onclick="closeModal()">Voltar</button><button class="btn" id="fuS">Salvar</button></div>`);
  $('#fuS').onclick = async () => {
    const { error } = await sb.rpc('registrar_servico_anterior', { p_veiculo: vid, p_plano: pid, p_data: $('#fuD').value || null, p_km: parseInt($('#fuK').value, 10) });
    if (error) return msg('#fuMsg', errText(error)); closeModal(); vManut();
  };
}

function formOcorrencia(){
  modal(`<h2>Nova ocorrência</h2><label>Veículo</label><select id="foV"><option value="">Escolha…</option>${VEIC.filter(v => v.ativo).map(v => `<option value="${v.id}">${esc(v.modelo)} · ${esc(v.placa)}</option>`).join('')}</select>
    <label>O que aconteceu?</label><textarea id="foD" rows="3" placeholder="Ex.: luz de injeção acesa, pneu careca"></textarea>
    <div id="foMsg"></div><div class="row" style="margin-top:12px"><button class="btn sec" onclick="closeModal()">Voltar</button><button class="btn" id="foS">Registrar</button></div>`);
  $('#foS').onclick = async () => {
    const { error } = await sb.rpc('salvar_ocorrencia', { p_veiculo: $('#foV').value || null, p_descricao: $('#foD').value });
    if (error) return msg('#foMsg', errText(error)); closeModal(); vManut('ocorrencias');
  };
}

// ----- Ordens de serviço -----
function mOrdens(){
  $('#maBody').innerHTML = `<div class="card"><div class="toolbar">
      <div style="flex:0 0 190px"><select id="moF"><option value="abertas">Abertas e em andamento</option><option value="concluida">Concluídas</option><option value="cancelada">Canceladas</option><option value="">Todas</option></select></div>
      <div><input id="moQ" placeholder="Buscar placa, modelo, oficina ou descrição"></div><button class="btn" id="moN">+ Nova OS</button></div>
    <div class="list" id="moL"></div></div>`;
  const draw = () => {
    const f = $('#moF').value, t = $('#moQ').value.trim().toLowerCase();
    const l = MD.ord.filter(o => (f === 'abertas' ? ['aberta','em_andamento'].includes(o.status) : !f || o.status === f) && !o.registro_anterior
      && (!t || [vNome(o.veiculo_id), o.oficina, o.descricao, o.numero].join(' ').toLowerCase().includes(t)));
    $('#moL').innerHTML = l.length ? l.map(o => {
      const tot = (+o.valor_pecas||0) + (+o.valor_mao_obra||0);
      const atras = ['aberta','em_andamento'].includes(o.status) && o.previsao && diasAte(o.previsao) < 0;
      return `<div class="item"><div class="grow"><div class="t">OS ${o.numero} · ${esc(vNome(o.veiculo_id))}</div>
        <div class="s">${o.tipo === 'preventiva' ? 'Preventiva' : 'Corretiva'} · ${esc(o.descricao)}${o.oficina ? ' · ' + esc(o.oficina) : ''}</div>
        <div class="s">Aberta ${fmtD(o.data_abertura)}${o.previsao && o.status !== 'concluida' ? ' · previsão ' + fmtD(o.previsao) : ''}${o.data_conclusao ? ' · concluída ' + fmtD(o.data_conclusao) : ''}${tot ? ' · ' + brl(tot) : ''}${o.bloqueio_id && ['aberta','em_andamento'].includes(o.status) ? ' · <b>veículo bloqueado</b>' : ''}</div>
        ${atras ? '<div class="s" style="color:var(--err);font-weight:600">Previsão de liberação vencida</div>' : ''}</div>
        <span class="tag ${o.status === 'aberta' ? 'aberta' : o.status}">${OS_ST[o.status]}</span><button class="btn sm sec" data-o="${o.id}">Abrir</button></div>`;
    }).join('') : '<div class="empty">Nenhuma OS</div>';
  };
  $('#moF').onchange = draw; $('#moQ').oninput = draw; draw();
  $('#moN').onclick = () => formOrdem(null, {});
  $('#moL').onclick = e => { const id = e.target.dataset.o; if (id) formOrdem(MD.ord.find(o => o.id === id)); };
}

function formOrdem(o, pre = {}){
  const d = o || { tipo: pre.tipo || 'corretiva', veiculo_id: pre.veiculo_id || '', descricao: pre.descricao || '', planos: pre.planos || [], data_abertura: hojeISO(), status: 'aberta', ocorrencia_id: pre.ocorrencia_id };
  const fechada = o && ['concluida','cancelada'].includes(o.status);
  const planosDo = vid => { const v = VEIC.find(x => x.id === vid); return MD.pla.filter(p => p.ativo && (p.veiculo_id === vid || (!p.veiculo_id && (!p.categoria_id || p.categoria_id === v?.categoria_id)))); };
  modal(`<h2>${o ? `OS ${o.numero}` : 'Nova ordem de serviço'}</h2>
    ${d.ocorrencia_id && !o ? `<div class="msg info">A partir da ocorrência: "${esc(pre.descricao)}"</div>` : ''}
    <label>Veículo</label><select id="oV" ${o ? 'disabled' : ''}><option value="">Escolha…</option>${VEIC.filter(v => v.ativo || v.id === d.veiculo_id).map(v => `<option value="${v.id}" ${v.id === d.veiculo_id ? 'selected' : ''}>${esc(v.modelo)} · ${esc(v.placa)} (${num(v.km_atual)} km)</option>`).join('')}</select>
    <label>Tipo</label><select id="oT"><option value="preventiva" ${d.tipo === 'preventiva' ? 'selected' : ''}>Preventiva</option><option value="corretiva" ${d.tipo === 'corretiva' ? 'selected' : ''}>Corretiva</option></select>
    <div id="oPl"></div>
    <label>Descrição</label><textarea id="oD" rows="2" placeholder="O que vai ser feito">${esc(d.descricao || '')}</textarea>
    <div class="row"><div><label>Oficina / fornecedor</label><input id="oO" value="${esc(d.oficina || '')}"></div><div><label>Nº nota / orçamento</label><input id="oN" value="${esc(d.nota || '')}"></div></div>
    <div class="row"><div><label>Abertura</label><input type="date" id="oA" value="${d.data_abertura}"></div><div><label>Previsão de liberação</label><input type="date" id="oP" value="${d.previsao || ''}"></div></div>
    ${fechada ? '' : `<label class="chk"><input type="checkbox" id="oB" ${(!o || o.bloqueio_id) ? 'checked' : ''}> Bloquear o veículo para reservas até a previsão</label>`}
    <div class="row"><div><label>Peças (R$)</label><input type="number" step="0.01" min="0" id="oVP" value="${d.valor_pecas ?? ''}"></div><div><label>Mão de obra (R$)</label><input type="number" step="0.01" min="0" id="oVM" value="${d.valor_mao_obra ?? ''}"></div></div>
    ${o ? `<div class="row"><div><label>Status</label><select id="oS">${Object.entries(OS_ST).filter(([k]) => !fechada || ['concluida','cancelada'].includes(k)).map(([k, l]) => `<option value="${k}" ${k === o.status ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
      <div id="oKW"><label>KM na conclusão</label><input type="number" min="0" id="oK" value="${o.km ?? ''}"></div></div>
      <div id="oCW"><label>Data de conclusão</label><input type="date" id="oC" value="${o.data_conclusao || hojeISO()}"></div>` : ''}
    <div id="oMsg"></div>
    <div class="row" style="margin-top:12px"><button class="btn sec" onclick="closeModal()">Voltar</button><button class="btn" id="oSv">Salvar</button></div>
    ${o && !fechada ? `<button class="btn ok full" id="oFim">Concluir OS</button>` : ''}`);
  const drawPl = () => {
    const vid = $('#oV').value, tipo = $('#oT').value;
    if (tipo !== 'preventiva' || !vid) return $('#oPl').innerHTML = '';
    const ps = planosDo(vid), sel = new Set(d.planos || []);
    $('#oPl').innerHTML = `<label>Itens do plano feitos nesta OS (zeram a contagem ao concluir)</label>${ps.length ? ps.map(p => `<label class="chk"><input type="checkbox" class="oPc" value="${p.id}" ${sel.has(p.id) ? 'checked' : ''}> ${esc(p.nome)}</label>`).join('') : '<p class="hint">Nenhum plano preventivo se aplica a este veículo.</p>'}`;
  };
  const drawSt = () => { if (!o) return; const c = $('#oS').value === 'concluida'; $('#oKW').style.display = c ? '' : 'none'; $('#oCW').style.display = c ? '' : 'none';
    if (c && !$('#oK').value) $('#oK').value = VEIC.find(v => v.id === o.veiculo_id)?.km_atual ?? ''; };
  $('#oV').onchange = drawPl; $('#oT').onchange = drawPl; drawPl();
  if (o) { $('#oS').onchange = drawSt; drawSt(); }
  const salvar = async (cancelar, status) => {
    const payload = { id: o?.id, veiculo_id: $('#oV').value, tipo: $('#oT').value, descricao: $('#oD').value, oficina: $('#oO').value, nota: $('#oN').value,
      data_abertura: $('#oA').value, previsao: $('#oP').value, valor_pecas: $('#oVP').value, valor_mao_obra: $('#oVM').value,
      planos: [...document.querySelectorAll('.oPc:checked')].map(x => x.value), bloquear: $('#oB')?.checked || false, cancelar,
      status: status || (o ? $('#oS').value : 'aberta'), km: o ? $('#oK').value : '', data_conclusao: o ? $('#oC').value : '', ocorrencia_id: d.ocorrencia_id };
    if (payload.status === 'concluida' && !payload.km) { drawSt(); return msg('#oMsg', 'Informe o KM na conclusão'); }
    $('#oSv').disabled = true;
    const { data, error } = await sb.rpc('salvar_ordem', { p: payload });
    $('#oSv').disabled = false;
    if (error) {
      const m = errText(error).match(/CONFLITO:(\d+)/);
      if (m) {
        $('#oMsg').innerHTML = `<div class="msg err">Existem <b>${m[1]}</b> reserva(s) para esse veículo até a previsão. Bloquear vai cancelá-las e os motoristas verão o motivo.</div><button class="btn err full" id="oConf">Bloquear e cancelar as reservas</button>`;
        $('#oConf').onclick = () => salvar(true, status); return;
      }
      return msg('#oMsg', errText(error));
    }
    closeModal(); vManut(window._mSub === 'painel' || window._mSub === 'ocorrencias' ? window._mSub : 'ordens');
  };
  $('#oSv').onclick = () => salvar(false);
  if ($('#oFim')) $('#oFim').onclick = () => { $('#oS').value = 'concluida'; drawSt(); $('#oK').focus(); msg('#oMsg', 'Confira o KM e a data de conclusão e clique em Salvar.', 'info'); };
}

// ----- Planos -----
const SUGESTOES = [['Troca de óleo e filtro', 10000, 6], ['Filtro de ar', 20000, 12], ['Filtro de combustível', 20000, 12], ['Alinhamento e balanceamento', 10000, ''], ['Revisão geral', 20000, 12], ['Pastilhas de freio (inspeção)', 15000, ''], ['Correia dentada', 50000, 48], ['Fluido de freio', '', 24]];
function mPlanos(){
  const alvo = p => p.veiculo_id ? vNome(p.veiculo_id) : p.categoria_id ? 'Categoria: ' + (CATS.find(c => c.id === p.categoria_id)?.nome || '?') : 'Todos os veículos';
  $('#maBody').innerHTML = `<div class="card"><h2>Planos preventivos</h2>
    <p class="hint" style="margin-top:0">Cada plano vence pelo que chegar primeiro: KM ou tempo. Vale para todos os veículos, para uma categoria ou para um veículo específico.</p>
    <div class="toolbar"><div></div><button class="btn" id="mpN">+ Novo plano</button></div>
    <div class="list" id="mpL">${MD.pla.length ? MD.pla.map(p => {
      const n = MD.sit.filter(s => s.plano_id === p.id), nv = n.filter(s => s.situacao === 'vencido').length;
      return `<div class="item"><div class="grow"><div class="t">${esc(p.nome)}</div>
        <div class="s">${[p.intervalo_km ? `a cada ${num(p.intervalo_km)} km` : '', p.intervalo_meses ? `a cada ${p.intervalo_meses} ${p.intervalo_meses > 1 ? 'meses' : 'mês'}` : ''].filter(Boolean).join(' ou ')} · ${esc(alvo(p))}</div>
        <div class="s">Avisa ${p.intervalo_km ? `${num(p.aviso_km)} km` : ''}${p.intervalo_km && p.intervalo_meses ? ' ou ' : ''}${p.intervalo_meses ? `${p.aviso_dias} dias` : ''} antes · ${n.length} veículo(s)${nv ? ` · <b style="color:var(--err)">${nv} vencido(s)</b>` : ''}</div></div>
        ${p.ativo ? '' : '<span class="tag">Inativo</span>'}<button class="btn sm sec" data-p="${p.id}">Editar</button></div>`; }).join('') : '<div class="empty">Nenhum plano ainda</div>'}</div></div>`;
  $('#mpN').onclick = () => formPlano(null);
  $('#mpL').onclick = e => { const id = e.target.dataset.p; if (id) formPlano(MD.pla.find(p => p.id === id)); };
}

function formPlano(p){
  const alvo = p ? (p.veiculo_id ? 'v:' + p.veiculo_id : p.categoria_id ? 'c:' + p.categoria_id : '') : '';
  modal(`<h2>${p ? 'Editar' : 'Novo'} plano preventivo</h2>
    ${p ? '' : `<label>Sugestões</label><div class="chips">${SUGESTOES.map((s, i) => `<button class="chip" data-i="${i}">${s[0]}</button>`).join('')}</div>`}
    <label>Item</label><input id="fpN" value="${esc(p?.nome || '')}" placeholder="Ex.: Troca de óleo e filtro">
    <div class="row"><div><label>A cada (km)</label><input type="number" min="1" id="fpK" value="${p?.intervalo_km ?? ''}" placeholder="vazio = não controla por km"></div>
    <div><label>A cada (meses)</label><input type="number" min="1" id="fpM" value="${p?.intervalo_meses ?? ''}" placeholder="vazio = não controla por tempo"></div></div>
    <div class="row"><div><label>Avisar faltando (km)</label><input type="number" min="0" id="fpAK" value="${p?.aviso_km ?? 1000}"></div>
    <div><label>Avisar faltando (dias)</label><input type="number" min="0" id="fpAD" value="${p?.aviso_dias ?? 15}"></div></div>
    <label>Vale para</label><select id="fpA"><option value="">Todos os veículos</option>
      <optgroup label="Categoria">${CATS.map(c => `<option value="c:${c.id}" ${alvo === 'c:' + c.id ? 'selected' : ''}>${esc(c.nome)}</option>`).join('')}</optgroup>
      <optgroup label="Veículo específico">${VEIC.filter(v => !v.excluido).map(v => `<option value="v:${v.id}" ${alvo === 'v:' + v.id ? 'selected' : ''}>${esc(v.modelo)} · ${esc(v.placa)}</option>`).join('')}</optgroup></select>
    ${p ? `<label class="chk"><input type="checkbox" id="fpAt" ${p.ativo ? 'checked' : ''}> Ativo</label>` : `<p class="hint">Sem histórico, a contagem começa hoje, com o KM atual de cada veículo. Depois você pode informar o último serviço real de cada um.</p>`}
    <div id="fpMsg"></div><div class="row" style="margin-top:12px"><button class="btn sec" onclick="closeModal()">Voltar</button><button class="btn" id="fpS">Salvar</button></div>`);
  document.querySelectorAll('.chip').forEach(c => c.onclick = () => { const s = SUGESTOES[c.dataset.i]; $('#fpN').value = s[0]; $('#fpK').value = s[1]; $('#fpM').value = s[2]; });
  $('#fpS').onclick = async () => {
    const a = $('#fpA').value;
    const { error } = await sb.rpc('salvar_plano', { p: { id: p?.id, nome: $('#fpN').value, intervalo_km: $('#fpK').value, intervalo_meses: $('#fpM').value,
      aviso_km: $('#fpAK').value, aviso_dias: $('#fpAD').value, categoria_id: a.startsWith('c:') ? a.slice(2) : '', veiculo_id: a.startsWith('v:') ? a.slice(2) : '', ativo: p ? $('#fpAt').checked : true } });
    if (error) return msg('#fpMsg', errText(error)); closeModal(); vManut('planos');
  };
}

// ----- Documentos -----
const TIPOS_DOC = ['Licenciamento (CRLV)', 'Seguro', 'IPVA', 'Extintor', 'Tacógrafo', 'Inspeção veicular'];
function mDocs(){
  $('#maBody').innerHTML = `<div class="card"><h2>Documentos e vencimentos</h2>
    <div class="toolbar"><div><input id="mdQ" placeholder="Buscar placa, modelo ou tipo"></div><button class="btn" id="mdN">+ Documento</button></div><div class="list" id="mdL"></div></div>`;
  const draw = () => {
    const t = $('#mdQ').value.trim().toLowerCase();
    const l = MD.doc.filter(d => !t || (vNome(d.veiculo_id) + ' ' + d.tipo).toLowerCase().includes(t));
    $('#mdL').innerHTML = l.length ? l.map(d => { const s = docSit(d), n = diasAte(d.vencimento);
      return `<div class="item ${s === 'ok' ? '' : s}"><div class="grow"><div class="t">${esc(d.tipo)} · ${esc(vNome(d.veiculo_id))}</div>
        <div class="s">Vence ${fmtD(d.vencimento)} (${n < 0 ? `vencido há ${-n} dia(s)` : `em ${n} dia(s)`})${d.valor ? ' · ' + brl(d.valor) : ''}${d.descricao ? ' · ' + esc(d.descricao) : ''}</div></div>
        <span class="tag ${s}">${SIT[s]}</span><button class="btn sm" data-r="${d.id}">Renovar</button><button class="btn sm sec" data-e="${d.id}">Editar</button></div>`; }).join('') : '<div class="empty">Nenhum documento cadastrado</div>';
  };
  $('#mdQ').oninput = draw; draw();
  $('#mdN').onclick = () => formDoc(null);
  $('#mdL').onclick = e => { if (e.target.dataset.e) formDoc(MD.doc.find(d => d.id === e.target.dataset.e)); if (e.target.dataset.r) formDoc(null, MD.doc.find(d => d.id === e.target.dataset.r)); };
}

function formDoc(d, renova){
  const base = d || renova || {};
  let venc = d?.vencimento || '';
  if (renova) { const x = new Date(renova.vencimento + 'T12:00'); x.setFullYear(x.getFullYear() + 1); venc = toDateInput(x); }
  modal(`<h2>${renova ? 'Renovar documento' : d ? 'Editar documento' : 'Novo documento'}</h2>
    ${renova ? `<p class="hint" style="margin-top:0">O documento atual (vence ${fmtD(renova.vencimento)}) fica no histórico e este passa a valer.</p>` : ''}
    <label>Veículo</label><select id="fdV" ${d || renova ? 'disabled' : ''}><option value="">Escolha…</option>${VEIC.filter(v => v.ativo || v.id === base.veiculo_id).map(v => `<option value="${v.id}" ${v.id === base.veiculo_id ? 'selected' : ''}>${esc(v.modelo)} · ${esc(v.placa)}</option>`).join('')}</select>
    <label>Tipo</label><input id="fdT" list="fdTL" value="${esc(base.tipo || '')}"><datalist id="fdTL">${TIPOS_DOC.map(t => `<option value="${t}">`).join('')}</datalist>
    <div class="row"><div><label>Vencimento</label><input type="date" id="fdD" value="${venc}"></div><div><label>Valor (R$)</label><input type="number" step="0.01" min="0" id="fdVl" value="${d?.valor ?? ''}"></div></div>
    <div class="row"><div><label>Avisar com (dias)</label><input type="number" min="0" id="fdA" value="${base.aviso_dias ?? 30}"></div><div><label>Observação</label><input id="fdO" value="${esc(d?.descricao || '')}" placeholder="Apólice, seguradora…"></div></div>
    ${d ? `<label class="chk"><input type="checkbox" id="fdAt" checked> Ativo (desmarque para remover da lista)</label>` : ''}
    <div id="fdMsg"></div><div class="row" style="margin-top:12px"><button class="btn sec" onclick="closeModal()">Voltar</button><button class="btn" id="fdS">Salvar</button></div>`);
  $('#fdS').onclick = async () => {
    const { error } = await sb.rpc('salvar_documento', { p: { id: d?.id, veiculo_id: $('#fdV').value, tipo: $('#fdT').value, vencimento: $('#fdD').value, valor: $('#fdVl').value,
      aviso_dias: $('#fdA').value, descricao: $('#fdO').value, renova_id: renova?.id, ativo: d ? $('#fdAt').checked : true } });
    if (error) return msg('#fdMsg', errText(error)); closeModal(); vManut(window._mSub === 'painel' ? 'painel' : 'documentos');
  };
}

// ----- Ocorrências -----
function mOcorr(){
  const pend = MD.oco.filter(o => o.status === 'pendente'), res = MD.oco.filter(o => o.status !== 'pendente').slice(0, 50);
  $('#maBody').innerHTML = `<div class="card"><h2>Ocorrências pendentes</h2>
    <p class="hint" style="margin-top:0">Chegam sozinhas quando a portaria registra uma observação na devolução da chave.</p>
    <div class="toolbar"><div></div><button class="btn sec" id="ocN">+ Ocorrência</button></div>
    <div class="list" id="ocL">${pend.length ? pend.map(o => `<div class="item alerta"><div class="grow"><div class="t">${esc(vNome(o.veiculo_id))}</div>
      <div class="s"><b>${esc(o.descricao)}</b> · ${fmt(o.criado_em)}${o.reserva_id ? ' · na devolução' : ''}</div></div>
      <button class="btn sm" data-c="${o.id}">Abrir OS corretiva</button><button class="btn sm sec" data-d="${o.id}">Descartar</button></div>`).join('') : '<div class="empty">Nenhuma ocorrência pendente</div>'}</div></div>
    <div class="card"><h2>Resolvidas recentemente</h2><div class="list">${res.length ? res.map(o => `<div class="item"><div class="grow"><div class="t">${esc(vNome(o.veiculo_id))}</div>
      <div class="s">${esc(o.descricao)} · ${fmt(o.criado_em)}${o.resolucao ? ' · ' + esc(o.resolucao) : ''}</div></div>
      <span class="tag ${o.status === 'convertida' ? 'concluida' : ''}">${o.status === 'convertida' ? 'Virou OS ' + (MD.ord.find(x => x.id === o.ordem_id)?.numero || '') : 'Descartada'}</span></div>`).join('') : '<div class="empty">Nada ainda</div>'}</div></div>`;
  $('#ocN').onclick = formOcorrencia;
  $('#ocL').onclick = e => {
    const c = e.target.dataset.c, dd = e.target.dataset.d;
    if (c) { const o = MD.oco.find(x => x.id === c); formOrdem(null, { veiculo_id: o.veiculo_id, tipo: 'corretiva', descricao: o.descricao, ocorrencia_id: o.id }); }
    if (dd) { modal(`<h2>Descartar ocorrência</h2><label>Motivo (opcional)</label><input id="dsM" placeholder="Ex.: verificado, sem problema"><div id="dsMsg"></div>
      <div class="row" style="margin-top:12px"><button class="btn sec" onclick="closeModal()">Voltar</button><button class="btn err" id="dsS">Descartar</button></div>`);
      $('#dsS').onclick = async () => { const { error } = await sb.rpc('descartar_ocorrencia', { p_id: dd, p_motivo: $('#dsM').value }); if (error) return msg('#dsMsg', errText(error)); closeModal(); vManut('ocorrencias'); }; }
  };
}

// ===== PWA =====
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});

boot();
</script>
</body>
</html>
